{% extends "base.html" %}

{% block title %}Login - Interne{% endblock %}

{% block content %}
<div class="login-page">
    <h1 class="form-heading">Login</h1>

    <a class="primary-action" href="/auth/github">Continue with GitHub</a>

    {% if let Some(err) = error %}
    <div class="error-message login-error">{{ err }}</div>
    {% endif %}

    {% if legacy_login_available %}
    <div class="login-divider"><span>or use an invite code</span></div>

    <form method="post" action="/login" autocomplete="off">
        <div class="form-group">
            <label for="invite_code">Invite Code</label>
            <input
                type="text"
                id="invite_code"
                name="invite_code"
                required
                autofocus
                autocomplete="off"
            >
        </div>

        <button type="submit">Login</button>
    </form>
    {% endif %}
</div>
{% endblock %}
